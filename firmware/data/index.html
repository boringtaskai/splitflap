<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALLE Studio</title>
    <style>
        :root { --bg: #1e1e1e; --flap-bg: transparent; --text: #f0f0f0; }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        a {
            cursor: pointer;
            text-decoration: none;
            color: #ccc;
        }
        a:hover {
            color: #fff;
        }
        ul {
            list-style: none
        }

        .clearfix:before,
        .clearfix:after {
            content: " ";
            display: table;
        }

        .clearfix:after {
            clear: both;
        }

        .clearfix {
            *zoom: 1;
        }

        html, body { 
            font: normal 11px "Helvetica Neue", Helvetica, sans-serif;
            color: #888;
            text-shadow: 0 1px 0 rgba(0, 0, 0, .3);
            background: rgb(150, 150, 150);
            background: -moz-radial-gradient(center, ellipse cover, rgba(150, 150, 150, 1) 0%, rgba(89, 89, 89, 1) 100%);
            background: -webkit-gradient(radial, center center, 0px, center center, 100%, color-stop(0%, rgba(150, 150, 150, 1)), color-stop(100%, rgba(89, 89, 89, 1)));
            background: -webkit-radial-gradient(center, ellipse cover, rgba(150, 150, 150, 1) 0%, rgba(89, 89, 89, 1) 100%);
            background: -o-radial-gradient(center, ellipse cover, rgba(150, 150, 150, 1) 0%, rgba(89, 89, 89, 1) 100%);
            background: -ms-radial-gradient(center, ellipse cover, rgba(150, 150, 150, 1) 0%, rgba(89, 89, 89, 1) 100%);
            background: radial-gradient(ellipse at center, rgba(150, 150, 150, 1) 0%, rgba(89, 89, 89, 1) 100%);
            filter: progid:DXImageTransform.Microsoft.gradient(startColorstr = '#969696', endColorstr = '#595959', GradientType = 1);
            color: var(--text); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0; 
            padding: 20px;
        }

        h1 { margin-bottom: 20px; color: #fff; text-transform: uppercase; letter-spacing: 2px; }

        /* --- INPUT & BUTTONS --- */
        .controls {
            background: #252525;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            margin-bottom: 40px;
            text-align: center;
        }
        input[type="text"] {
            width: 70%;
            padding: 10px;
            font-size: 18px;
            text-transform: uppercase;
            border: 2px solid #444;
            background: #111;
            color: #fff;
            border-radius: 5px;
            text-align: center;
            font-family: inherit;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
            font-weight: bold;
        }
        button:hover { background: #0056b3; }

        /* Styling Khusus Logo */
        .logo-container {
            width: 100%;
            max-width: 300px; /* Atur lebar maksimal logo */
            margin-bottom: 10px;
        }
        .logo-container svg {
            width: 100%;
            height: auto;
        }
        
        /* --- SIMULASI SPLITFLAP CSS (CodePen Style Adapted) --- */
        .splitflap-display {
            display: flex;
            justify-content: center;
            gap: 5px;
            perspective: 1000px; /* Penting untuk efek 3D */
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .flap-container {
            text-align: center;
            position: relative;
            background-color: var(--flap-bg);
            text-align: center;
            color: white;
            overflow: hidden;
        }

        ul.flip {
            position: relative;
            float: left;
            margin: 5px;
            width: 60px;
            height: 90px;
            font-size: 70px;
            font-weight: bold;
            line-height: 87px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .7);
        }

        ul.flip li {
            z-index: 1;
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;

        }

        ul.flip li:first-child {
            z-index: 2;
        }

        ul.flip li a {
            display: block;
            height: 100%;
            perspective: 200px;
        }

        ul.flip li a div {
            z-index: 1;
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
        }

        ul.flip li a div .shadow {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        ul.flip li a div.up {
            transform-origin: 50% 100%;
            top: 0;
        }

        ul.flip li a div.up:after {
            content: "";
            position:absolute;
            top:44px;
            left:0;
            z-index: 5;
                width: 100%;
            height: 3px;
            background-color: rgba(0,0,0,.4);
        }

        ul.flip li a div.down {
            transform-origin: 50% 0%;
            bottom: 0;
        }

        ul.flip li a div div.inn {
            position: absolute;
            left: 0;
            z-index: 1;
            width: 100%;
            height: 200%;
            color: #ccc;
            text-shadow: 0 1px 2px #000;
            text-align: center;
            background-color: #333;
            border-radius: 6px;
        }

        ul.flip li a div.up div.inn {
            top: 0;

        }

        ul.flip li a div.down div.inn {
            bottom: 0;
        }

        body.play ul li.before {
            z-index: 3;
        }

        body.play ul li.active {
            animation: asd .5s .5s linear both;
            z-index: 2;
        }

        @keyframes asd {
            0% {
                z-index: 2;
            }
            5% {
                z-index: 4;
            }
            100% {
                z-index: 4;
            }
        }

        body.play ul li.active .down {
            z-index: 2;
            animation: turn .5s .5s linear both;
        }

        @keyframes turn {
            0% {
                transform: rotateX(90deg);
            }
            100% {
                transform: rotateX(0deg);
            }
        }

        body.play ul li.before .up {
            z-index: 2;
            animation: turn2 .5s linear both;
        }

        @keyframes turn2 {
            0% {
                transform: rotateX(0deg);
            }
            100% {
                transform: rotateX(-90deg);
            }
        }

        /* SHADOW */

        body.play ul li.before .up .shadow {
            background: -moz-linear-gradient(top, rgba(0, 0, 0, .1) 0%, rgba(0, 0, 0, 1) 100%);
            background: -webkit-gradient(linear, left top, left bottom, color-stop(0%, rgba(0, 0, 0, .1)), color-stop(100%, rgba(0, 0, 0, 1)));
            background: linear-gradient(top, rgba(0, 0, 0, .1) 0%, rgba(0, 0, 0, 1) 100%);
            background: -o-linear-gradient(top, rgba(0, 0, 0, .1) 0%, rgba(0, 0, 0, 1) 100%);
            background: -ms-linear-gradient(top, rgba(0, 0, 0, .1) 0%, rgba(0, 0, 0, 1) 100%);
            background: linear-gradient(to bottom, rgba(0, 0, 0, .1) 0%, rgba(0, 0, 0, 1) 100%);
            animation: show .5s linear both;
        }

        body.play ul li.active .up .shadow {
            background: -moz-linear-gradient(top, rgba(0, 0, 0, .1) 0%, rgba(0, 0, 0, 1) 100%);
            background: -webkit-gradient(linear, left top, left bottom, color-stop(0%, rgba(0, 0, 0, .1)), color-stop(100%, rgba(0, 0, 0, 1)));
            background: linear-gradient(top, rgba(0, 0, 0, .1) 0%, rgba(0, 0, 0, 1) 100%);
            background: -o-linear-gradient(top, rgba(0, 0, 0, .1) 0%, rgba(0, 0, 0, 1) 100%);
            background: -ms-linear-gradient(top, rgba(0, 0, 0, .1) 0%, rgba(0, 0, 0, 1) 100%);
            background: linear-gradient(to bottom, rgba(0, 0, 0, .1) 0%, rgba(0, 0, 0, 1) 100%);
            animation: hide .5s .3s linear both;
        }

        /*DOWN*/

        body.play ul li.before .down .shadow {
            background: -moz-linear-gradient(top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, .1) 100%);
            background: -webkit-gradient(linear, left top, left bottom, color-stop(0%, rgba(0, 0, 0, 1)), color-stop(100%, rgba(0, 0, 0, .1)));
            background: linear-gradient(top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, .1) 100%);
            background: -o-linear-gradient(top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, .1) 100%);
            background: -ms-linear-gradient(top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, .1) 100%);
            background: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, .1) 100%);
            animation: show .5s linear both;
        }

        body.play ul li.active .down .shadow {
            background: -moz-linear-gradient(top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, .1) 100%);
            background: -webkit-gradient(linear, left top, left bottom, color-stop(0%, rgba(0, 0, 0, 1)), color-stop(100%, rgba(0, 0, 0, .1)));
            background: linear-gradient(top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, .1) 100%);
            background: -o-linear-gradient(top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, .1) 100%);
            background: -ms-linear-gradient(top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, .1) 100%);
            background: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, .1) 100%);
            animation: hide .5s .3s linear both;
        }

        @keyframes show {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        @keyframes hide {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

    </style>
</head>

    <h1>STUDIO</h1>

    <div id="display" class="splitflap-display">
    </div>

    <div class="controls">
        <input type="text" id="textInput" placeholder="HELLO WORLD">
        <br>
        <button id="btnUpdate">SHOW</button>
        <div style="margin-top:15px; font-size: 12px; color: #888;">
            Hardware Status: <span id="statusText">Ready</span>
        </div>
    </div>

    <script>
        const NUM_MODULES = 6; 
        const ALPHABET = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&°=,*()-o"; 
        
        // --- INISIALISASI (Pengganti $(document).ready) ---
        document.addEventListener("DOMContentLoaded", function() {
            const textInput = document.getElementById("textInput");
            const btnUpdate = document.getElementById("btnUpdate");

            // Set maxlength
            textInput.setAttribute("maxlength", NUM_MODULES);
            
            // Generate HTML modul
            createModules();
            
            // Event Listener tombol (Pengganti .click())
            btnUpdate.addEventListener("click", function() {
                let text = textInput.value.toUpperCase();
                sendToESP32(text);
                animateToText(text);
            });
        });

        // Membuat HTML untuk setiap modul flap
        function createModules() {
            let html = '';
            for(let i=0; i<NUM_MODULES; i++) {
                html += `<div class="flap-container"><ul class="flip" id="flap-${i}" data-char=" ">`;

                for (let j=0; j<ALPHABET.length; j++) {                      
                    html += `
                        <li>
                            <a href="#">
                                <div class="up">
                                    <div class="shadow"></div>
                                    <div class="inn">${ALPHABET[j]}</div>
                                </div>
                                <div class="down">
                                    <div class="shadow"></div>
                                    <div class="inn">${ALPHABET[j]}</div>
                                </div>
                            </a>
                        </li>`;
                }
                    
                html += `</ul></div>`;
            }
            // Pengganti $("#display").html(html)
            document.getElementById("display").innerHTML = html;
        }

        function animateToText(targetText) {
            // Padding text agar panjangnya pas dengan jumlah modul
            while(targetText.length < NUM_MODULES) targetText += " ";
            targetText = targetText.substring(0, NUM_MODULES);

            for (let i = 0; i < NUM_MODULES; i++) {
                let targetChar = targetText[i];
                // Pengganti $('#flap-' + i)
                let flap = document.getElementById(`flap-${i}`);
                
                // Pengganti .attr('data-char')
                let currentChar = flap.getAttribute('data-char');

                if (currentChar !== targetChar) {
                    flipCycle(flap, currentChar, targetChar);
                }
            }
        }

        // Fungsi Rekursif untuk memutar flap
        function flipCycle(el, current, target) {
            // Cari index huruf saat ini dan target di ALPHABET
            let currentIndex = ALPHABET.indexOf(current);
            let targetIndex = ALPHABET.indexOf(target);
            
            if (currentIndex === -1) currentIndex = 0;
            if (targetIndex === -1) targetIndex = 0;

            // Tentukan huruf selanjutnya
            let nextIndex = (currentIndex + 1) % ALPHABET.length;
            let nextChar = ALPHABET[nextIndex];

            // --- DOM MANIPULATION (Vanilla JS) ---
            // Cari li yang aktif: el.querySelector("li.active")
            let activeLi = el.querySelector("li.active");
            let allLi = el.querySelectorAll("li");

            if (!activeLi) {
                // Case 1: Belum ada yang aktif (awal)
                activeLi = allLi[0];
                activeLi.classList.add("before");
                activeLi.classList.remove("active");
                
                // nextSibling bisa berupa text node (enter/spasi), jadi pakai nextElementSibling
                let nextLi = activeLi.nextElementSibling; 
                if (nextLi) nextLi.classList.add("active");
                
                document.body.classList.add("play");
            } 
            else if (activeLi === el.lastElementChild) {
                // Case 2: Sudah di elemen terakhir, loop ke awal
                // Hapus class 'before' dari semua li
                allLi.forEach(li => li.classList.remove("before"));
                
                activeLi.classList.add("before");
                activeLi.classList.remove("active");
                
                // Aktifkan elemen pertama
                let firstLi = allLi[0];
                firstLi.classList.add("active");
                
                document.body.classList.add("play");
            } 
            else {
                // Case 3: Perpindahan normal ke elemen berikutnya
                allLi.forEach(li => li.classList.remove("before"));
                
                activeLi.classList.add("before");
                activeLi.classList.remove("active");
                
                let nextLi = activeLi.nextElementSibling;
                if (nextLi) nextLi.classList.add("active");
                
                document.body.classList.add("play");
            }

            // Tunggu animasi CSS selesai (300ms total)
            setTimeout(function() {
                el.setAttribute('data-char', nextChar);

                if (nextChar !== target) {
                    setTimeout(() => flipCycle(el, nextChar, target), 250);
                }
            }, 300);
        }

        // Fungsi Pengiriman Data (Pengganti $.ajax)
        function sendToESP32(text) {
            const statusText = document.getElementById("statusText");
            if(statusText) statusText.innerText = "Sending...";
            
            // Menggunakan Fetch API
            fetch("/text", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    text: text,
                    force_full_rotation: false
                })
            })
            .then(response => {
                if (response.ok) {
                    if(statusText) statusText.innerText = "Updated (OK)";
                    console.log("ESP32 Response OK");
                } else {
                    throw new Error("Server responded with error");
                }
            })
            .catch(error => {
                if(statusText) statusText.innerText = "Error Sending";
                console.error("ESP32 Error:", error);
            });
        }
    </script>
</body>
</html>
